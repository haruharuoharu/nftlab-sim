name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nftlab
          POSTGRES_PASSWORD: nftlab
          POSTGRES_DB: nftlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nftlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nftlab:nftlab@localhost:5432/nftlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: psql "$DATABASE_URL" -f db/schema.sql
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
