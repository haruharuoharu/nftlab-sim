[package]
name = "nftlab-progress"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
[lib]
crate-type = ["cdylib", "lib"]
name = "nftlab_progress"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
